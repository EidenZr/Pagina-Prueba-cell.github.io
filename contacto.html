<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto | TecnoPhone Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="page-body">
    <header class="site-header">
      <nav class="navbar navbar-expand-lg navbar-dark fixed-top menu-principal">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
            <img src="imagenes/logo/logo.png" alt="Logo de TecnoPhone Store" class="logo" />
            <span>TecnoPhone Store</span>
          </a>
          <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
              <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
              <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="page-main">
      <section class="page-banner">
        <div class="container">
          <p class="eyebrow">Contacto</p>
          <h1>Habla con nosotros</h1>
        </div>
      </section>

      <section class="seccion">
        <div class="container contact-layout">
          <div class="contact-form-card">
            <h2>Solicita información</h2>
            <form>
              <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" placeholder="Tu nombre" />
              </div>
              <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" class="form-control" placeholder="tu@email.com" />
              </div>
              <div class="mb-3">
                <label class="form-label">Mensaje</label>
                <textarea class="form-control" rows="4" placeholder="Escribe tu consulta..."></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100">Enviar</button>
            </form>
          </div>

          <div class="contact-list">
            <div class="contacto-item">
              <i class="bi bi-telephone-fill"></i>
              <h3>Teléfono</h3>
              <p>+591 7000 1234</p>
            </div>
            <div class="contacto-item">
              <i class="bi bi-whatsapp"></i>
              <h3>WhatsApp</h3>
              <p>+591 7654 9876</p>
            </div>
            <div class="contacto-item">
              <i class="bi bi-envelope-fill"></i>
              <h3>Correo</h3>
              <p>ventas@tecnophone.com</p>
            </div>
            <div class="contacto-item">
              <i class="bi bi-geo-alt-fill"></i>
              <h3>Dirección</h3>
              <p>Av. Tecnológica #123, La Paz</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container footer-contenido">
        <p>&copy; 2026 TecnoPhone Store</p>
        <div class="redes">
          <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
          <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
        </div>
      </div>
    </footer>
  </body>
</html>
